# Lint rules checked in CI (.github/workflows/ci.yml)
line-length = 120
target-version = "py39"   # eval scripts also run on the Mac's Python 3.9

[lint]
select = [
  "E", "W",  # pycodestyle errors and warnings
  "F",       # pyflakes: unused imports, undefined names
  "I",       # import order
  "B",       # bugbear: common bug patterns
]

[lint.isort]
known-first-party = ["guardrails", "fusion", "retriever", "tracing"]

[lint.per-file-ignores]
"gateway/guardrails.py" = ["E501"]   # attack patterns are long regexes; splitting them hurts readability
"ci/build_dashboard.py" = ["E501"]   # PromQL queries and panel descriptions stay on one line so they can be copied as they are
