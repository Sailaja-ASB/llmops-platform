apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app: {{ .Release.Name }}
data:
  RETRIEVAL_MODE: {{ .Values.config.retrievalMode | quote }}
  RETRIEVAL_CANDIDATES: {{ .Values.config.retrievalCandidates | quote }}
  LOAD_RERANKER: {{ .Values.config.loadReranker | quote }}
  TORCH_THREADS: {{ .Values.config.torchThreads | quote }}
