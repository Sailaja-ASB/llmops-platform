replicaCount: 2

image:
  repository: llm-gateway
  tag: "0.5.2"
  pullPolicy: IfNotPresent   # image is loaded into kind, never pulled

service:
  type: NodePort
  port: 8000
  nodePort: 30080

# Model + version tracking (goes into the ConfigMap)
config:
  ollamaUrl: "http://host.docker.internal:11434"   # Ollama runs on the Mac, not in the cluster
  modelName: "qwen2.5:3b"
  promptVersion: "v1"
  connectTimeout: "3"
  requestTimeout: "120"
  maxBodyBytes: "32768"
  rateLimitPerMin: "600"   # per key, per pod; raised so load tests measure the model, not the limiter
  maxInflight: "8"         # generations running at once per pod; extra requests get a fast 503
  breakerThreshold: "3"
  breakerCooldownS: "15"
  ragUrl: "http://rag-service:8001"   # Week 4: in-cluster address of the RAG retrieval service
  ragTimeout: "10"
  ragPromptVersion: "rag-v2"      # Day 4 prompt; rag-v1 still selectable per request for A/B evals
  guardrailsEnabled: "true"       # input injection check, context filter, output redaction + citation checks
  citationRepair: "true"          # attach a citation to clearly supported uncited sentences

# Secret: API keys (comma-separated). Override at install time, never commit real keys.
apiKeys: "dev-key-change-me"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Week 3 lesson: under load on an 8 GB Mac, 1 s probe timeouts restarted healthy pods.
# Liveness is lenient (restart only if truly stuck ~1 min); readiness reacts faster.
probes:
  liveness:
    path: /healthz
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  readiness:
    path: /readyz
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Graceful shutdown: longer than the longest stream, so scale-down doesn't cut answers
terminationGracePeriodSeconds: 90
preStopSleepSeconds: 5   # let the Service stop routing to the pod before it shuts down

# CPU-based Horizontal Pod Autoscaler (needs metrics-server in the cluster)
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50   # % of the CPU *request* (100m)

strategy:
  maxUnavailable: 0   # never drop below desired replicas during a rollout
  maxSurge: 1
