replicaCount: 2

image:
  repository: llm-gateway
  tag: "0.2"
  pullPolicy: IfNotPresent   # image is loaded into kind, never pulled

service:
  type: NodePort
  port: 8000
  nodePort: 30080

# Model + version tracking (goes into the ConfigMap)
config:
  ollamaUrl: "http://host.docker.internal:11434"   # Ollama runs on the Mac, not in the cluster
  modelName: "qwen2.5:3b"
  promptVersion: "v1"
  connectTimeout: "3"
  requestTimeout: "120"
  maxBodyBytes: "32768"
  rateLimitPerMin: "60"
  breakerThreshold: "3"
  breakerCooldownS: "15"

# Secret: API keys (comma-separated). Override at install time, never commit real keys.
apiKeys: "dev-key-change-me"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  liveness:
    path: /healthz
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /readyz
    periodSeconds: 5
    failureThreshold: 2

strategy:
  maxUnavailable: 0   # never drop below desired replicas during a rollout
  maxSurge: 1
