apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app: {{ .Release.Name }}
data:
  OLLAMA_URL: {{ .Values.config.ollamaUrl | quote }}
  MODEL_NAME: {{ .Values.config.modelName | quote }}
  PROMPT_VERSION: {{ .Values.config.promptVersion | quote }}
  APP_VERSION: {{ .Chart.AppVersion | quote }}
  CONNECT_TIMEOUT: {{ .Values.config.connectTimeout | quote }}
  REQUEST_TIMEOUT: {{ .Values.config.requestTimeout | quote }}
  MAX_BODY_BYTES: {{ .Values.config.maxBodyBytes | quote }}
  RATE_LIMIT_PER_MIN: {{ .Values.config.rateLimitPerMin | quote }}
  MAX_INFLIGHT: {{ .Values.config.maxInflight | quote }}
  BREAKER_THRESHOLD: {{ .Values.config.breakerThreshold | quote }}
  BREAKER_COOLDOWN_S: {{ .Values.config.breakerCooldownS | quote }}
  RAG_URL: {{ .Values.config.ragUrl | quote }}
  RAG_TIMEOUT: {{ .Values.config.ragTimeout | quote }}
  RAG_PROMPT_VERSION: {{ .Values.config.ragPromptVersion | quote }}
