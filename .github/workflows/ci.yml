# Runs on every push and pull request. A red check means: don't merge, don't deploy.
# Quality gates (both run the configuration from the Helm charts):
#   retrieval: Top-1 of the shipped mode >= MIN_TOP1 on the 47-question benchmark
#   answers:   the real model (qwen2.5:3b) must cite the expected source, invent no citations, rarely refuse
# Order: cheap checks first, the expensive LLM gate last (only after everything else passed).
# On main only: after every gate passed, publish both images to GitHub Container Registry (ghcr.io).
# The full 47 + held-out questions run nightly (nightly-eval.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint, unit tests, versions
    runs-on: ubuntu-24.04   # pinned: same OS every run (ubuntu-latest moves to 26)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install tools (+ gateway packages for the tracing tests)
        run: pip install ruff==0.16.9 pytest==9.2.0 -r gateway/requirements.txt
      - name: Lint (ruff.toml)
        run: ruff check --output-format github .
      - name: Unit tests (guardrails, question sets, tracing)
        run: python -m pytest -q gateway/tests
      - name: Code, chart and image versions agree
        run: python ci/check_versions.py

  helm:
    name: Helm charts
    runs-on: ubuntu-24.04   # also validates the observability chart: Prometheus config + dashboard PromQL
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.2
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: Install promtool (Prometheus config and PromQL checker)
        run: |
          curl -sSL https://github.com/prometheus/prometheus/releases/download/v3.15.1/prometheus-3.15.1.linux-amd64.tar.gz \
            | tar -xz --strip-components=1 prometheus-3.15.1.linux-amd64/promtool
          sudo mv promtool /usr/local/bin/
      - name: helm lint
        run: |
          helm lint helm/llm-gateway --set apiKeys=ci-key
          helm lint helm/rag-service
          helm lint helm/observability --set grafana.adminPassword=ci-pass
      - name: Render and validate against the Kubernetes schema
        run: |
          mkdir -p rendered
          helm template llm-gateway helm/llm-gateway --set apiKeys=ci-key > rendered/gateway.yaml
          helm template llm-gateway helm/llm-gateway --set apiKeys=ci-key --set autoscaling.enabled=true > rendered/gateway-hpa.yaml
          helm template rag-service helm/rag-service > rendered/rag.yaml
          helm template observability helm/observability --set grafana.adminPassword=ci-pass > rendered/observability.yaml
          kubeconform -strict -summary rendered/
      - name: Prometheus config and alert rules are valid (promtool)
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet --break-system-packages pyyaml
          helm template observability helm/observability --set grafana.adminPassword=ci-pass \
            --show-only templates/prometheus-config.yaml \
            > prometheus-config.yaml
          python3 -c "import yaml; d = yaml.safe_load(open('prometheus-config.yaml'))['data']; [open(k, 'w').write(v) for k, v in d.items()]"
          promtool check config prometheus.yml   # also checks the alert rules it loads (alerts.yml)
      - name: Alert rules behave as intended (promtool test rules)
        run: promtool test rules ci/alert_tests.yml
      - name: Every dashboard query parses (promtool)
        run: python3 ci/check_dashboards.py promtool

  gateway-image:
    name: Gateway image + smoke test
    needs: lint-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: gateway
          load: true
          tags: llm-gateway:ci
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
      - name: Start the gateway (no model, no RAG service)
        run: |
          docker run -d --name gw -p 8000:8000 \
            -e API_KEYS=ci-key -e OLLAMA_URL=http://127.0.0.1:9 -e RAG_URL=http://127.0.0.1:9 \
            llm-gateway:ci
      - name: Smoke test
        run: |
          VERSION=$(sed -n 's/^appVersion: *"\{0,1\}\([^" ]*\).*/\1/p' helm/llm-gateway/Chart.yaml)
          echo "### Gateway smoke test (expected version $VERSION)" >> "$GITHUB_STEP_SUMMARY"
          bash ci/smoke_gateway.sh http://localhost:8000 ci-key "$VERSION"
      - name: Gateway logs
        if: failure()
        run: docker logs gw

  rag-retrieval-gate:
    name: RAG image + retrieval gate
    needs: lint-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MIN_TOP1: "0.95"   # 47-question benchmark; hybrid scores 47/47, dense and BM25 43/47 (91.5%)
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build (CPU-only PyTorch, models baked in)
        uses: docker/build-push-action@v7
        with:
          context: rag
          load: true
          tags: rag-service:ci
          build-args: TORCH_INDEX_URL=https://download.pytorch.org/whl/cpu
          cache-from: type=gha,scope=rag
          cache-to: type=gha,mode=max,scope=rag
      - name: Start the RAG service with the Helm chart's settings
        run: |
          MODE=$(sed -n 's/^ *retrievalMode: *"\([^"]*\)".*/\1/p' helm/rag-service/values.yaml)
          RERANK=$(sed -n 's/^ *loadReranker: *"\([^"]*\)".*/\1/p' helm/rag-service/values.yaml)
          echo "From helm/rag-service/values.yaml: retrievalMode=$MODE loadReranker=$RERANK"
          docker run -d --name rag -p 8001:8001 -e RETRIEVAL_MODE="$MODE" -e LOAD_RERANKER="$RERANK" rag-service:ci
          for _ in $(seq 1 90); do curl -sf localhost:8001/readyz > /dev/null && break; sleep 2; done
          curl -sf localhost:8001/info
      - name: Retrieval gate (47 questions)
        run: python3 rag/eval/eval_service.py --url http://localhost:8001 --min-top1 "$MIN_TOP1"
      - name: RAG logs
        if: failure()
        run: docker logs rag

  llm-answer-gate:
    name: LLM answer gate (qwen2.5:3b)
    needs: [gateway-image, rag-retrieval-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OLLAMA_IMAGE: ollama/ollama:0.40.16
      MODEL: qwen2.5:3b
      MIN_MODEL_CITATION_ACC: "0.9"  # rag-v2 on the Mac: 47/47; rag-v1: 40/47 (85%)
      MAX_INVENTED: "0"
      MAX_FALSE_REFUSALS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Gateway image (from cache)
        uses: docker/build-push-action@v7
        with:
          context: gateway
          load: true
          tags: llm-gateway:ci
          cache-from: type=gha,scope=gateway
      - name: RAG image (from cache)
        uses: docker/build-push-action@v7
        with:
          context: rag
          load: true
          tags: rag-service:ci
          build-args: TORCH_INDEX_URL=https://download.pytorch.org/whl/cpu
          cache-from: type=gha,scope=rag
      - name: Model cache
        uses: actions/cache@v5
        with:
          path: ~/ollama-models
          key: ollama-models-${{ env.MODEL }}-v1
      - name: Start Ollama, RAG service and gateway with the Helm charts' settings (+ warm-up)
        run: bash ci/start_stack.sh
      - name: Answer quality gate (12 of 47 questions, temperature 0)
        run: |
          python3 rag/eval/eval_ask.py --url http://localhost:8080 --key ci-key --every 4 --temperature 0 \
            --min-model-citation-acc "$MIN_MODEL_CITATION_ACC" --max-invented "$MAX_INVENTED" \
            --max-false-refusals "$MAX_FALSE_REFUSALS" --out results
      - name: Let the cache read the model files (Ollama wrote them as root)
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" ~/ollama-models
      - name: Upload answers for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: llm-answer-eval
          path: results/
          if-no-files-found: ignore
      - name: Service logs
        if: failure()
        run: |
          docker logs gw --tail 80
          docker logs rag --tail 40
          docker logs ollama --tail 40

  publish-images:
    name: Publish images to ghcr.io (main only)
    needs: [helm, llm-answer-gate]    # llm-answer-gate itself needs lint-test, gateway-image and rag-retrieval-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to ghcr.io with the workflow's own token (no personal secret needed)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Work out tags (release tags are never overwritten)
        id: tags
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          sha=$(git rev-parse --short=7 HEAD)
          echo "### Published images" >> "$GITHUB_STEP_SUMMARY"
          for svc in llm-gateway rag-service; do
            version=$(sed -n 's/^appVersion: *"\{0,1\}\([^" ]*\).*/\1/p' "helm/$svc/Chart.yaml")
            image="ghcr.io/$owner/$svc"
            tags="$image:sha-$sha"
            if docker buildx imagetools inspect "$image:$version" > /dev/null 2>&1; then
              note="$version already published, kept unchanged (bump the version to release); pushed sha-$sha only"
            else
              tags="$tags,$image:$version"
              note="new release $version + sha-$sha"
            fi
            key=$(echo "$svc" | tr '-' '_')
            echo "${key}_tags=$tags" >> "$GITHUB_OUTPUT"
            echo "- \`$image\`: $note" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Push llm-gateway
        uses: docker/build-push-action@v7
        with:
          context: gateway
          push: true
          tags: ${{ steps.tags.outputs.llm_gateway_tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          cache-from: type=gha,scope=gateway
      - name: Push rag-service (CPU-only PyTorch, models baked in)
        uses: docker/build-push-action@v7
        with:
          context: rag
          push: true
          tags: ${{ steps.tags.outputs.rag_service_tags }}
          build-args: TORCH_INDEX_URL=https://download.pytorch.org/whl/cpu
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          cache-from: type=gha,scope=rag
